name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.2-bookworm
        env:
          POSTGRES_USER: viga
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: viga_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U viga -d viga_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm test:db
      - run: pnpm build
      - run: pnpm pack
